name: Release

# Every push to main publishes a new release. The version is derived from the
# latest published release (patch-bumped) - or from package.json when it is
# set higher, to deliberately jump a minor/major. A manual run does the same;
# it does not commit anything back, so package.json in the repo is only the
# "floor" version, while the built app always reports the released version.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Serialize runs so two quick pushes don't compute (and fight over) the same
# version; never cancel a build that is already producing installers.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute next version
        id: compute
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/next-version.js
        shell: bash

  # Create the (empty) release up front so the platform builds don't race to
  # create it - previously whichever build finished first won, and the slower
  # Windows build ended up appending its installer last. Now all three build
  # jobs run in parallel and only upload to this pre-made tag. It starts as a
  # draft and is published by the last job, so a failed build never leaves an
  # empty "latest" release that installed apps would try to update from.
  create-release:
    needs: version
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Two commits so the CHANGELOG check can diff this push against the
          # previous tip of main.
          fetch-depth: 2
      - name: Check the CHANGELOG entry matches the version being released
        # A section numbered for a version that has since been taken would be
        # silently ignored below and the release would ship with fallback
        # notes. Stop before publishing so the number can be corrected.
        # Skipped on manual runs, where HEAD~1 is an already-released push.
        if: github.event_name == 'push'
        run: node .github/scripts/check-changelog.js ${{ needs.version.outputs.version }}
        shell: bash
      - name: Build release notes
        # Use the curated CHANGELOG section for this version as the release
        # body; fall back to GitHub's auto-generated notes when there is none.
        id: notes
        run: node .github/scripts/release-notes.js ${{ needs.version.outputs.version }}
        shell: bash
      - name: Create release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: ${{ steps.notes.outputs.has_notes != 'true' }}
          draft: true

  build:
    needs: [version, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          # One universal app for Apple Silicon and Intel Macs alike.
          - os: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          # The oldest supported Ubuntu keeps the AppImage running on older distros.
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # Registry hiccups (ECONNRESET) show up on hosted runners now and
        # then - retry twice with a pause before giving up.
        run: npm ci || (sleep 20 && npm ci) || (sleep 60 && npm ci)
        shell: bash

      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set version
        # Runner-only bump: tauri.conf.json reads the version from package.json,
        # so this is what the app and the installer names carry. Not committed.
        run: npm version ${{ needs.version.outputs.version }} --no-git-tag-version --allow-same-version
        shell: bash

      - name: Type check
        run: npm run typecheck

      - name: Rust tests
        run: npm run test:rust

      - name: Build and upload
        # Builds the installers (unsigned - no code-signing certificates in
        # CI), signs the updater artifacts with TAURI_SIGNING_PRIVATE_KEY and
        # uploads them to the release made above, merging this platform into
        # its latest.json - the feed the in-app updater reads.
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  electron-update-feed:
    # Installed Electron builds still poll latest.yml / latest-linux.yml.
    # Pointing those feeds at the Tauri installers moves them over on their own.
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the Electron update feeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ needs.version.outputs.version }}"
          gh release download "$tag" --pattern '*-setup.exe' --pattern '*.AppImage' --dir assets
          node .github/scripts/electron-update-feed.js "${{ needs.version.outputs.version }}" assets
          gh release upload "$tag" assets/latest.yml assets/latest-linux.yml --clobber
        shell: bash

  publish:
    # Only now, with every installer and feed uploaded, does the release become
    # visible - to people and to the updaters of installed apps.
    needs: [version, electron-update-feed]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v${{ needs.version.outputs.version }}" --repo "${{ github.repository }}" --draft=false --latest
        shell: bash
